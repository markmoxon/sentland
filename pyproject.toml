[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentland"
version = "1.1.0"
description = "Generate landscapes from The Sentinel"
readme = "ReadMe.md"
authors = [
    { name = "Simon Owen", email = "simon@simonowen.com" }
]
license = "MIT"
keywords = ["sentinel", "landscape"]
urls = { "Homepage" = "https://github.com/simonowen/sentland" }

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Environment :: Console"
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "matplotlib>=3.8.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.13.2",
]

[project.scripts]
sentland = "sentland.sentland:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentland" = ["golden/*.bin"]

[tool.ruff.lint]
preview = true # opt into preview rules
select = ["E", "F", "I"]  # E=pycodestyle, F=pyflakes, I=import sorting
ignore = ["E501", "E226", "E265"] # relax some whitespace rules

[tool.mypy]
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
